[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futures-risk-console"
version = "0.1.0"
description = "Deterministic risk-gated Binance USD-M futures automation"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "greenlet>=3,<4",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
